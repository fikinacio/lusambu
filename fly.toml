app = "lusambu"
primary_region = "cdg"

[build]

[env]
  CHECKPOINT_DB_PATH = "/data/checkpoints.sqlite"

[[mounts]]
  source = "lusambu_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[checks]
  [checks.health]
    type = "http"
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
